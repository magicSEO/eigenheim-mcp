# DRAFT – Custom GPT Action for ChatGPT (Web/Mobile).
# GPT Actions speak REST, not MCP. Each path below needs a small REST bridge
# on eigenheim-invest.de/api/market/* that calls the same tool logic.
# Not live yet – do not import before the bridge exists.
openapi: 3.1.0
info:
  title: Eigenheim Invest – Berlin Real Estate Market
  version: 0.1.0
  description: Live Berlin €/m² prices, rental yields, land values 2026, population forecast and listings. Read-only, no auth.
servers:
  - url: https://eigenheim-invest.de/api/market
paths:
  /area-prices:
    get:
      operationId: getAreaPrices
      summary: Current €/m² for apartments and houses in a Berlin locality or nearby town
      parameters:
        - { name: area, in: query, required: true, schema: { type: string }, description: "e.g. Zehlendorf, Prenzlauer Berg, Falkensee" }
      responses: { "200": { description: OK } }
  /market-overview:
    get:
      operationId: getMarketOverview
      summary: Berlin-wide KPIs (prices, rents, notary transactions)
      responses: { "200": { description: OK } }
  /rental-yield:
    get:
      operationId: calculateRentalYield
      summary: Gross rental yield and price multiplier
      parameters:
        - { name: area, in: query, schema: { type: string } }
        - { name: price_per_sqm, in: query, schema: { type: number } }
        - { name: rent_per_sqm, in: query, schema: { type: number } }
      responses: { "200": { description: OK } }
  /bodenrichtwerte:
    get:
      operationId: getBodenrichtwerte
      summary: 2026 standard land values for 96 Berlin localities
      parameters:
        - { name: query, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }
  /population-forecast:
    get:
      operationId: getPopulationForecast
      summary: Population forecast 2024–2040 per Berlin district
      responses: { "200": { description: OK } }
  /properties:
    get:
      operationId: searchProperties
      summary: Current listings of Eigenheim Invest (no street addresses)
      parameters:
        - { name: property_type, in: query, schema: { type: string, enum: [house, apartment, land] } }
        - { name: location, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: min_rooms, in: query, schema: { type: number } }
        - { name: min_living_area, in: query, schema: { type: number } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses: { "200": { description: OK } }
  /properties/{slug}:
    get:
      operationId: getPropertyDetails
      summary: Public exposé details
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }
  /guides:
    get:
      operationId: searchGuides
      summary: Search editorial guides
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 20 } }
      responses: { "200": { description: OK } }
